<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Cecurile mele</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-of-type{border:0}.it .n{flex:1;min-width:0}.ph{width:56px;height:56px;display:grid;place-items:center;color:var(--mute);font-size:22px;border:1px dashed var(--mute);background:none;padding:0}

.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tot{font-size:22px;font-weight:700}

#bn button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;line-height:1;color:var(--mute);padding:6px 18px;min-width:84px}
#bn small{font-size:12px}#bn button.on{color:var(--acc);font-weight:700}
#bn #fab{background:var(--acc);color:var(--paper);border-radius:28px;padding:12px 26px;margin-top:-22px;box-shadow:0 2px 10px #0005}

.bars i{display:block;width:100%;background:var(--line);border-radius:4px 4px 0 0;min-height:2px}.bars .on i{background:var(--acc)}
.sr{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.sr:last-child{border:0}.sr .n{flex:1;min-width:0}.up{color:#c2410c}.dn{color:#15803d}
[data-ph]{flex:none;display:flex}[data-p]{cursor:pointer}
.seg{display:flex;margin-bottom:10px}.seg button{flex:1;border-radius:0}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0}.seg .on{background:var(--acc);color:var(--paper)}
.bars div{min-width:0}.bars .z i{opacity:.4}.bars small{font-size:10px}

#lb,#sc{position:fixed;inset:0;background:#000d;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
#lb[hidden],#sc[hidden]{display:none}#li{max-width:100%;max-height:75vh;border-radius:12px;object-fit:contain}
#v{width:100%;max-width:520px;max-height:70vh;border-radius:14px;object-fit:cover}
</style></head><body>
<header><h1 id="h">Cecurile mele</h1><button id="b2">＋ Adaugă</button><button id="b4" title="Cont">👤</button></header>
<main id="m"></main><div id="t"></div>

<dialog id="ad"><p id="am" class="mute"></p>
<div id="af"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Parolă (minim 6 caractere)" autocomplete="current-password">

<div id="ao" hidden><p id="ae"></p><button id="lo">Ieși din cont</button></div>
<div class="row" style="margin-top:14px;gap:8px"><button id="ex">Exportă date</button><button id="im">Importă date</button></div><input id="if" type="file" accept=".json,application/json" hidden>

<button id="ax" style="margin-top:14px">Închide</button></dialog>
<div id="lb" hidden><img id="li" alt=""><div class="row" style="gap:12px"><button id="lc">Închide</button><button id="lp" class="p">Schimbă poza</button></div></div>
<div id="sc" hidden><video id="v" playsinline muted></video><p class="mute" style="color:#fff">Îndreaptă camera spre codul QR</p><button id="sx">Închide</button></div>
<input id="qf" type="file" accept="image/*" capture="environment" hidden>
<input id="pf" type="file" accept="image/*" hidden>
<dialog id="d"><form method="dialog"><p id="dt" class="mute"></p><textarea id="ta" placeholder="Link sau text"></textarea>
<div class="row" style="margin-top:10px"><button value="x">Anulează</button><button id="ok" class="p" value="ok">Salvează</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s);const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
let db,R=[],P={},cur=-1,pk=null,pend=null,tab='r',mo=ym(new Date()),sm='m',pd=Date.now(),prod=null,pfrom=null,lastErr={},retrying=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const idb=n=>new Promise((ok,er)=>{const q=indexedDB.open(n,1);q.onupgradeneeded=()=>{q.result.createObjectStore('r',{keyPath:'id'});q.result.createObjectStore('p',{keyPath:'k'})};q.onsuccess=()=>ok(q.result);q.onerror=er});
const tx=(s,m,f)=>new Promise((ok,er)=>{const t=db.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r.result);t.onerror=er});
const key=n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9а-я%.]+/g,' ').trim();
async function load(){R=(await tx('r','readonly',o=>o.getAll())).filter(r=>!r.deleted).sort((a,b)=>b.ts-a.ts);P={};(await tx('p','readonly',o=>o.getAll())).forEach(x=>P[x.k]=x.img)}
const save=r=>{r.u=Date.now();return tx('r','readwrite',o=>o.put(r)).then(()=>sync())};
// Extrage datele dintr-un text de chitanță fiscală (format SFS Moldova)
function parse(t){
 t=t.replace(/[`'´~=_-]{6,}/g,' ').replace(/\s+/g,' ');const tm=t.search(/\bTOTAL\b/);if(tm<0)return null;
 const hm=t.match(/J\d{6,}/),from=hm?hm.index+hm[0].length:0,body=t.slice(from,tm);
 const items=[],re=/(\d+\.\d{2})\s*([A-Z])(?=\s|$)/g;let m,last=0;
 while(m=re.exec(body)){let s=body.slice(last,m.index);last=re.lastIndex;
  const q=(s.match(/\d+\.\d{3}/)||['1'])[0];s=s.replace(q,' ').replace(/\sx\s/,' ');
  const u=s.match(/(\d+\.\d{2})(?!.*\d+\.\d{2})/);if(u)s=s.replace(u[0],' ');
  const n=s.replace(/\s+/g,' ').replace(/[\s,;]+$/,'').trim();if(n)items.push({n,q:+q,u:u?+u[1]:+m[1]/+q,t:+m[1],l:m[2]})}
 const d=t.match(/DATA\s+(\d\d)\.(\d\d)\.(\d{4})\s+ORA\s+(\d\d:\d\d)/),no=t.match(/№:?\s*(\d+)/),tot=t.slice(tm).match(/TOTAL\s+(\d+\.\d{2})/);
 return{store:((h=>(h.match(/((?:[A-ZĂÂÎȘȚŞŢ0-9.&"'-]+\s+)*[A-ZĂÂÎȘȚŞŢ0-9.&"'-]+)\s*$/)||[,h.slice(-40)])[1].trim())(t.split(/COD FISCAL/i)[0]))||'Magazin',ts:d?new Date(`${d[3]}-${d[2]}-${d[1]}T${d[4]}`).getTime():Date.now(),no:no?no[1]:'',total:tot?+tot[1]:items.reduce((a,i)=>a+i.t,0),items}}
const clean=v=>{const m=(v||'').match(/https?:\/\/[^\s\u0000-\u001f\u007f-\u009f\u200b-\u200d\ufeff]+/);return m?m[0]:''};
async function getReceipt(link){link=clean(link);if(!link)return{fail:'link invalid'};
 try{const c=new AbortController();setTimeout(()=>c.abort(),20000);const px=localStorage.px,
  rs=await fetch(px?px+'?u='+encodeURIComponent(link):link,{signal:c.signal});if(!rs.ok)return{fail:'răspuns '+rs.status};
  const h=await rs.text(),d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('script,style').forEach(e=>e.remove());
  const raw=d.body.textContent,p=parse(raw);return p&&p.items.length?{...p,raw,pending:false}:{fail:'nu am găsit produse în pagină'}}
 catch(e){return{fail:localStorage.px?'proxy-ul nu răspunde':'site-ul nu poate fi citit direct, setează proxy-ul (👤 → Avansat)'}}}
async function retry(){if(!navigator.onLine||retrying)return;retrying=1;let ch=0;
 for(const r of R.filter(x=>x.pending&&x.link)){const g=await getReceipt(r.link);if(g.fail)lastErr[r.id]=g.fail;else{await save({...r,...g});ch=1}}
 retrying=0;if(ch){const id=cur>=0&&R[cur]&&R[cur].id;await load();cur=id?R.findIndex(x=>x.id===id):-1;show()}}
async function addLink(link){
 link=clean(link);if(!link)return toast('Link invalid.');
 const id=link.split('/').pop().split('?')[0].toUpperCase();let r=R.find(x=>x.id===id);
 tab='r';prod=null;if(r){cur=R.indexOf(r);return show()}
 r={id,link,store:'Cec nou',ts:Date.now(),items:[],total:0,pending:true};toast('Se citesc produsele...');
 let g=await getReceipt(link);if(g.fail&&navigator.onLine)g=await getReceipt(link);
 if(g.fail)lastErr[id]=g.fail;else r={...r,...g};
 await save(r);await load();cur=R.findIndex(x=>x.id===id);show();
 if(r.pending)toast(navigator.onLine?'Nu am putut citi produsele ('+g.fail+'). Se reîncearcă automat.':'Ești offline. Produsele apar automat când te conectezi.')}
async function addText(raw){const p=parse(raw);if(!p||!p.items.length)return toast('Nu am găsit produse în text.');
 const id=pend||('T'+p.ts+'-'+p.no);const old=R.find(x=>x.id===id)||{};
 await save({...old,...p,id,raw,pending:false});pend=null;await load();cur=R.findIndex(x=>x.id===id);show()}
const shrink=async f=>{const b=await createImageBitmap(f),s=Math.min(1,1024/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)};
const fmt=r=>new Date(r.ts).toLocaleString('ro-RO',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const lei=n=>n.toFixed(2);
function show(){const m=$('#m');$('#h').textContent=cur<0?(space==='guest'?'Cecurile mele · guest':'Cecurile mele'):'Cec';
 document.querySelectorAll('#bn [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(tab==='s'){$('#h').textContent=prod?'Produs':'Statistici';return stats()}
 if(cur<0){m.innerHTML=R.length?R.map((r,i)=>mh(i)+`<div class="card" data-i="${i}"><div class="row"><b>${esc(r.store)}${r.demo?' <span class="mute">(demo)</span>':''}</b><span class="m tot" style="font-size:18px">${lei(r.total)}</span></div><div class="mute">${fmt(r)} · ${r.items.length} produse</div><div class="th">${r.items.slice(0,6).map(i=>P[key(i.n)]?`<img src="${P[key(i.n)]}">`:'').join('')}</div></div>`).join(''):'<p class="mute">Niciun cec încă. Apasă „Scanează” jos și îndreaptă camera spre codul QR de pe cec.</p>';
  m.querySelectorAll('.card').forEach(c=>c.onclick=()=>{cur=+c.dataset.i;show()});return}
 const r=R[cur];
 m.innerHTML=`<div class="nav"><button id="bk">‹ Toate</button><span class="mute">${cur+1} / ${R.length}</span><span><button id="pv" ${cur>=R.length-1?'disabled':''}>‹</button> <button id="nx" ${cur<1?'disabled':''}>›</button></span></div>
 <div class="card"><b>${esc(r.store)}</b>${r.demo?' <span class="mute">(demo)</span>':''}<div class="mute">${fmt(r)}${r.no?' · bon №'+r.no:''}</div>${r.pending?'<p>Produsele nu au fost încă citite.'+(lastErr[r.id]?'<br><span class="mute">Motiv: '+esc(lastErr[r.id])+'</span>':'')+'</p><button id="rt" class="p">Încearcă din nou</button> <button id="pt">Lipește textul</button>':''}
 ${r.items.map(i=>{const k=key(i.n);return`<div class="it"><${P[k]?`img class="ph" src="${P[k]}"`:'button class="ph"'} data-k="${esc(k)}">${P[k]?'':'+'}</${P[k]?'img':'button'}><div class="n" data-p="${esc(k)}">${esc(i.n)}<div class="mute m">${i.q} × ${lei(i.u)}</div></div><span class="m">${lei(i.t)}</span></div>`}).join('')}
 <div class="row" style="margin-top:10px"><span>Total</span><span class="tot m">${lei(r.total)}</span></div></div>
 <div class="row"><a href="${esc(r.link||'#')}" target="_blank" class="mute">Deschide cecul online</a>${r.demo?'':'<button id="rm">Șterge</button>'}</div>`;
 $('#bk').onclick=()=>{cur=-1;show()};$('#pv').onclick=()=>{cur++;show()};$('#nx').onclick=()=>{cur--;show()};
 if($('#rm'))$('#rm').onclick=async()=>{if(confirm('Ștergi cecul?')){await save({id:r.id,deleted:true,items:[],ts:r.ts});await load();cur=-1;show()}};
 if($('#pt'))$('#pt').onclick=()=>ask('Lipește textul cecului',r.id);
 if($('#rt'))$('#rt').onclick=async()=>{toast('Se încearcă...');await retry();const x=R.find(y=>y.id===r.id);if(x&&x.pending)toast('Încă nu merge. Verifică internetul sau proxy-ul.')};
 m.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>zoom(e.dataset.k));bind(m)}
const mh=i=>{const f=x=>new Date(R[x].ts).toLocaleDateString('ro-RO',{month:'long',year:'numeric'});return i&&f(i)===f(i-1)?'':'<h3 class="mute" style="margin:14px 0 8px;text-transform:capitalize">'+f(i)+'</h3>'};
const zoom=k=>{pk=k;if(P[k]){$('#li').src=P[k];$('#lb').hidden=false}else $('#pf').click()};
const bind=m=>{m.querySelectorAll('[data-ph]').forEach(e=>e.onclick=()=>zoom(e.dataset.ph));m.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>openProd(e.dataset.p))};
const dl=(d,o)=>new Date(d).toLocaleDateString('ro-RO',o),D0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function range(){const d=new Date(pd);if(sm==='m'){const a=new Date(d.getFullYear(),d.getMonth(),1);return[a,new Date(a.getFullYear(),a.getMonth()+1,1)]}
 const a=D0(d);a.setDate(a.getDate()-((a.getDay()+6)%7));return[a,new Date(a.getFullYear(),a.getMonth(),a.getDate()+7)]}
function shift(n){const[a]=range();pd=(sm==='m'?new Date(a.getFullYear(),a.getMonth()+n,1):new Date(a.getFullYear(),a.getMonth(),a.getDate()+7*n)).getTime()}
const th=p=>`<span data-ph="${esc(p.k)}">${P[p.k]?`<img class="ph sm" src="${P[p.k]}">`:'<span class="ph sm"></span>'}</span>`;
const row=(p,sub,val,cl)=>`<div class="sr">${th(p)}<div class="n" data-p="${esc(p.k)}">${esc(p.n)}<div class="mute">${sub}</div></div><b class="m ${cl||''}" data-p="${esc(p.k)}">${val}</b></div>`;
function openProd(k){pfrom={tab,cur};prod=k;tab='s';cur=-1;show()}
function stats(){const m=$('#m');if(prod)return product(m);
 const rs=R.filter(r=>!r.pending);
 if(!rs.length){m.innerHTML='<p class="mute">Statisticile apar după ce ai cel puțin un cec cu produse.</p>';return}
 const[a,b]=range(),inr=(r,x,y)=>r.ts>=x&&r.ts<y,sum=l=>l.reduce((s,r)=>s+r.total,0),cm=rs.filter(r=>inr(r,a,b)),tm=sum(cm);
 const pa=sm==='m'?new Date(a.getFullYear(),a.getMonth()-1,1):new Date(a.getFullYear(),a.getMonth(),a.getDate()-7),pv=sum(rs.filter(r=>inr(r,pa,a)));
 const nd=Math.round((b-a)/864e5),days=[...Array(nd)].map((_,i)=>{const d0=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i),d1=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i+1),l=cm.filter(r=>inr(r,d0,d1));return{d:d0,v:sum(l),n:l.length}});
 const mx=Math.max(1,...days.map(x=>x.v)),last=new Date(b.getFullYear(),b.getMonth(),b.getDate()-1);
 const title=sm==='m'?dl(a,{month:'long',year:'numeric'}):dl(a,{day:'numeric',month:'short'})+' – '+dl(last,{day:'numeric',month:'short'});
 const pr={},st={};cm.forEach(r=>{st[r.store]=(st[r.store]||0)+r.total;r.items.forEach(i=>{const k=key(i.n),p=pr[k]=pr[k]||{n:i.n,k,c:0,t:0};p.c+=i.q;p.t+=i.t})});const pl=Object.values(pr);
 const h={};rs.slice().sort((x,y)=>x.ts-y.ts).forEach(r=>r.items.forEach(i=>{const k=key(i.n);(h[k]=h[k]||{n:i.n,k,a:[]}).a.push(i.u)}));
 const ch=Object.values(h).filter(x=>x.a.length>1).map(x=>{const l=x.a[x.a.length-1],q=x.a[x.a.length-2];return{...x,l,q,d:(l-q)/q*100}}).filter(x=>Math.abs(x.d)>=1).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,5);
 const ds=pv>0?`${tm>=pv?'+':''}${Math.round((tm-pv)/pv*100)}% față de ${sm==='m'?'luna':'săptămâna'} trecută${sm==='m'?'':''}`:'';
 m.innerHTML=`<div class="seg"><button data-sm="w" class="${sm==='w'?'on':''}">Săptămână</button><button data-sm="m" class="${sm==='m'?'on':''}">Lună</button></div>
 <div class="nav"><button id="mp">‹</button><b style="text-transform:capitalize">${title}</b><button id="mn" ${b>new Date()?'disabled':''}>›</button></div>
 <div class="kp"><div class="card"><b>${lei(tm)}</b><span class="mute">cheltuit</span></div><div class="card"><b>${cm.length}</b><span class="mute">cecuri</span></div><div class="card"><b>${cm.length?lei(tm/cm.length):'0.00'}</b><span class="mute">medie/cec</span></div></div>
 <div class="mute" style="margin:-4px 0 8px">${ds}</div>
 <div class="card"><b>Pe zile</b><div class="bars">${days.map((x,i)=>`<div data-i="${i}" class="${x.v?'':'z'}">${sm==='w'?`<small>${x.v?Math.round(x.v):''}</small>`:''}<i style="height:${Math.round(x.v/mx*110)}px"></i><small>${sm==='w'?dl(x.d,{weekday:'short'}):(i===0||(i+1)%5===0?i+1:'')}</small></div>`).join('')}</div>
 <div id="cap" class="mute" style="text-align:center;min-height:20px">Atinge o zi ca să vezi cheltuielile.</div></div>
